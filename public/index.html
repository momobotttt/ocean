<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>海洋 · 估波遊戲</title>
<style>
  :root{--deep:#052540;--deep2:#0a3b63;--blue:#1673b8;--sky:#3fa7dd;--light:#7fd0ef;--foam:#d6f1fb;--white:#fff;--gold:#ffcf5c;--gold-d:#e8a72c;--good:#1fb27a;--bad:#e46a6a;--line:rgba(255,255,255,.14);--ink:#eaf6fd;--muted:#9db9cc;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;} html,body{margin:0;height:100%;}
  body{font-family:-apple-system,"PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:radial-gradient(120% 80% at 50% -10%,#0d456f 0%,var(--deep2) 42%,var(--deep) 100%);min-height:100dvh;overflow-x:hidden;}
  .waves{position:fixed;top:0;left:0;right:0;height:180px;z-index:0;opacity:.5;pointer-events:none;}
  .app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 16px 96px;min-height:100dvh;}
  header.brand{display:flex;align-items:center;gap:11px;padding:20px 4px 12px;}
  .logo{width:44px;height:44px;flex:0 0 44px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35));}
  .brand h1{margin:0;font-size:22px;letter-spacing:.28em;font-weight:800;background:linear-gradient(180deg,#fff,#bfe6f7);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand .tag{font-size:11px;color:var(--light);letter-spacing:.12em;margin-top:2px;}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.045));border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;backdrop-filter:blur(6px);box-shadow:0 8px 24px rgba(0,10,25,.28);}
  .auth-wrap{padding-top:5vh;} .auth-hero{text-align:center;margin-bottom:8px;}
  .auth-hero .big{font-size:26px;font-weight:800;letter-spacing:.3em;background:linear-gradient(180deg,#fff,#a9def6);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .auth-hero p{color:var(--muted);font-size:13px;margin:6px 0 0;}
  label{display:block;font-size:12px;color:var(--light);margin:12px 2px 6px;}
  input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(3,20,36,.55);color:#fff;font-size:16px;outline:none;}
  input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(63,167,221,.22);}
  .btn{width:100%;padding:14px;border:none;border-radius:13px;font-size:16px;font-weight:700;background:linear-gradient(180deg,var(--sky),var(--blue));color:#fff;margin-top:16px;box-shadow:0 6px 16px rgba(22,115,184,.4);cursor:pointer;}
  .btn:active{transform:translateY(1px);} .btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--ink);}
  .switch{text-align:center;margin-top:14px;font-size:13px;color:var(--muted);} .switch a{color:var(--light);font-weight:700;text-decoration:none;cursor:pointer;}
  .err{color:#ff9a9a;font-size:12.5px;text-align:center;margin-top:10px;min-height:16px;}
  .userbar{display:flex;align-items:center;justify-content:space-between;margin:10px 0 4px;} .userbar .hi{font-size:14px;} .userbar .hi b{color:#fff;}
  .pts{display:flex;align-items:center;gap:6px;background:rgba(255,207,92,.14);border:1px solid rgba(255,207,92,.4);padding:6px 12px;border-radius:999px;font-weight:800;color:var(--gold);} .pts small{color:var(--muted);font-weight:600;}
  .ann{font-size:12px;color:var(--light);background:rgba(63,167,221,.1);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:8px 0;}
  .sect-t{font-size:13px;color:var(--light);letter-spacing:.1em;margin:16px 4px 2px;font-weight:700;}
  .match .lg{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:10px;}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:12px;}
  .team{display:flex;flex-direction:column;align-items:center;gap:6px;} .team .fl{font-size:26px;} .team .nm{font-size:13px;font-weight:700;text-align:center;line-height:1.2;} .vs{font-size:12px;color:var(--muted);font-weight:800;}
  .picks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .pick{border:1px solid var(--line);background:rgba(3,20,36,.4);border-radius:12px;padding:9px 6px;text-align:center;cursor:pointer;transition:.15s;}
  .pick .p-l{font-size:11px;color:var(--muted);} .pick .p-o{font-size:16px;font-weight:800;color:#fff;margin-top:2px;} .pick .p-pts{font-size:10px;color:var(--gold);margin-top:2px;}
  .pick.sel{border-color:var(--sky);background:rgba(63,167,221,.2);box-shadow:0 0 0 2px rgba(63,167,221,.35) inset;}
  .pick.locked{opacity:.55;cursor:default;} .pick.win{border-color:var(--good);background:rgba(31,178,122,.2);}
  .mstat{font-size:11px;margin-top:10px;color:var(--muted);text-align:center;} .mstat.done{color:var(--good);} .mstat.lost{color:var(--bad);} .mstat.mine b{color:var(--light);}
  .lb-row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line);} .lb-row:last-child{border-bottom:none;}
  .rank{width:26px;text-align:center;font-weight:800;color:var(--muted);} .rank.top{color:var(--gold);font-size:17px;}
  .lb-name{flex:1;font-weight:600;} .lb-name.me{color:var(--light);} .lb-name .meb{font-size:10px;background:var(--blue);color:#fff;padding:1px 6px;border-radius:6px;margin-left:6px;} .lb-pts{font-weight:800;color:var(--gold);}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;background:linear-gradient(180deg,rgba(5,25,45,.2),rgba(4,20,36,.96));border-top:1px solid var(--line);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom);}
  nav.tabs .in{display:flex;width:100%;max-width:480px;} .tab{flex:1;text-align:center;padding:11px 0 12px;color:var(--muted);font-size:11px;cursor:pointer;} .tab .ic{font-size:20px;display:block;margin-bottom:2px;} .tab.on{color:var(--light);}
  .hidden{display:none !important;} .note{font-size:11px;color:var(--muted);text-align:center;margin:16px 4px 0;line-height:1.5;} .foam-line{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:6px 0;}
</style>
</head>
<body>
<svg class="waves" viewBox="0 0 480 180" preserveAspectRatio="none"><path d="M0,60 C120,110 240,10 480,70 L480,0 L0,0 Z" fill="#1673b8" opacity=".5"/><path d="M0,90 C160,40 300,130 480,80 L480,0 L0,0 Z" fill="#3fa7dd" opacity=".4"/><path d="M0,120 C140,160 320,60 480,120 L480,0 L0,0 Z" fill="#7fd0ef" opacity=".25"/></svg>

<div class="app">
  <header class="brand">
    <svg class="logo" viewBox="0 0 48 48"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe9fb"/><stop offset="1" stop-color="#1673b8"/></linearGradient></defs><circle cx="24" cy="24" r="22" fill="#062a4a" stroke="url(#g)" stroke-width="2"/><path d="M6 30 C13 22 18 34 24 27 C30 20 35 32 42 25" fill="none" stroke="#7fd0ef" stroke-width="2.4" stroke-linecap="round"/><path d="M8 36 C15 29 19 39 24 33 C29 27 34 37 40 31" fill="none" stroke="#3fa7dd" stroke-width="2.2" stroke-linecap="round" opacity=".8"/></svg>
    <div><h1>海洋</h1><div class="tag">估波 · 儲分 · 打排行榜</div></div>
  </header>

  <section id="auth" class="auth-wrap">
    <div class="auth-hero"><div class="big">海洋</div><p id="authSub">登入你嘅帳戶，開始估波儲分</p></div>
    <div class="card">
      <label>帳號</label><input id="u" autocomplete="username" placeholder="改個名俾自己">
      <label>密碼</label><input id="p" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="btn" id="authBtn" onclick="doAuth()">登入</button>
      <div class="err" id="authErr"></div>
      <div class="switch" id="authSwitch">未有帳戶？<a onclick="toggleMode()">註冊一個</a></div>
    </div>
    <div class="note">積分純遊戲用嚟打排行榜，唔可以買、唔可以換錢。<br>估中先加分，估錯唔會扣，安心玩。</div>
  </section>

  <main id="main" class="hidden">
    <div class="userbar"><div class="hi">你好，<b id="uname">—</b> 👋</div><div class="pts">🪙 <span id="upts">0</span> <small>分</small></div></div>
    <section id="view-matches">
      <div class="ann" id="ann"></div>
      <div class="sect-t">今期賽事 · 估中邊隊贏</div>
      <div id="matchList"></div>
      <div class="note">估咗就 lock，等賽果出咗，估中即刻上分（估啱冷門加多啲）。估錯唔會扣分。</div>
    </section>
    <section id="view-lb" class="hidden">
      <div class="sect-t">排行榜 · 邊個估得最叻</div><div class="card" id="lbBox"></div>
      <div class="note">排名淨係計積分，積分係遊戲分數，唔涉及任何金錢。</div>
    </section>
    <section id="view-me" class="hidden">
      <div class="sect-t">我嘅帳戶</div>
      <div class="card">
        <div class="userbar" style="margin:0"><div class="hi">帳號</div><b id="meName">—</b></div><div class="foam-line"></div>
        <div class="userbar" style="margin:0"><div class="hi">總積分</div><span class="lb-pts" id="mePts">0</span></div><div class="foam-line"></div>
        <div class="userbar" style="margin:0"><div class="hi">估中率</div><b id="meRate">—</b></div>
      </div>
      <button class="btn ghost" onclick="logout()">登出</button>
      <div class="note">積分係遊戲分數，唔可以買、唔可以換錢。</div>
    </section>
  </main>
</div>

<nav class="tabs hidden" id="nav"><div class="in">
  <div class="tab on" data-v="matches" onclick="go('matches')"><span class="ic">⚽</span>賽事</div>
  <div class="tab" data-v="lb" onclick="go('lb')"><span class="ic">🏆</span>排行榜</div>
  <div class="tab" data-v="me" onclick="go('me')"><span class="ic">🌊</span>我</div>
</div></nav>

<script>
let TOKEN = localStorage.getItem('ocean_token') || null;
let ME = null, MATCHES = [], MYPICKS = {}, mode = 'login', poll = null;

async function api(pathn, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {}, TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {});
  const r = await fetch(pathn, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('錯誤 ' + r.status));
  return j;
}
function toggleMode() { mode = mode === 'login' ? 'register' : 'login'; renderAuthMode(); }
function renderAuthMode() {
  authBtn.textContent = mode === 'login' ? '登入' : '註冊';
  authSub.textContent = mode === 'login' ? '登入你嘅帳戶，開始估波儲分' : '改個名同密碼，即刻開始玩';
  authSwitch.innerHTML = mode === 'login' ? '未有帳戶？<a onclick="toggleMode()">註冊一個</a>' : '已經有帳戶？<a onclick="toggleMode()">去登入</a>';
  authErr.textContent = '';
}
async function doAuth() {
  const username = u.value.trim(), password = p.value;
  if (!username || !password) { authErr.textContent = '請填帳號同密碼'; return; }
  try {
    const j = await api('/api/' + (mode === 'register' ? 'register' : 'login'), { method: 'POST', body: JSON.stringify({ username, password }) });
    TOKEN = j.token; localStorage.setItem('ocean_token', TOKEN); ME = j.user; enter();
  } catch (e) { authErr.textContent = e.message; }
}
function logout() { TOKEN = null; localStorage.removeItem('ocean_token'); if (poll) clearInterval(poll); location.reload(); }

function enter() {
  auth.classList.add('hidden'); main.classList.remove('hidden'); nav.classList.remove('hidden');
  uname.textContent = ME.username; refresh(); go('matches');
  if (poll) clearInterval(poll); poll = setInterval(refresh, 5000);
}
async function refresh() {
  try {
    const me = await api('/api/me'); ME = me.user; renderTop();
    const md = await api('/api/matches'); MATCHES = md.matches; ann.textContent = md.announcement || '';
    const mp = await api('/api/mypicks'); MYPICKS = {}; mp.picks.forEach(p => MYPICKS[p.matchId] = p);
    renderMatches(); if (!document.getElementById('view-lb').classList.contains('hidden')) renderLB();
    renderProfile();
  } catch (e) { if (String(e.message).includes('登入')) logout(); }
}
function renderTop() { upts.textContent = ME.points; }
function ptsFor(o) { return Math.round((+o || 1) * 10); }
function selName(m, k) { return k === 'home' ? m.home.n : k === 'draw' ? '和' : m.away.n; }

function renderMatches() {
  const list = matchList; list.innerHTML = '';
  if (!MATCHES.length) { list.innerHTML = '<div class="card" style="text-align:center;color:var(--muted)">暫時未有賽事，等陣再嚟 🌊</div>'; return; }
  MATCHES.forEach(m => {
    const pick = MYPICKS[m.id]; const settled = pick && pick.status !== 'open';
    const wrap = document.createElement('div'); wrap.className = 'card match';
    let ph = '';
    ['home', 'draw', 'away'].forEach(k => {
      const sel = pick && pick.sel === k ? 'sel' : '', locked = pick ? 'locked' : '', win = settled && m.result === k ? 'win' : '';
      ph += `<div class="pick ${sel} ${locked} ${win}" onclick="predict(${m.id},'${k}')"><div class="p-l">${selName(m, k)}</div><div class="p-o">${(+m.o[k]).toFixed(2)}</div><div class="p-pts">+${ptsFor(m.o[k])}</div></div>`;
    });
    let stat = '';
    if (!pick) stat = `<div class="mstat">揀一個估法 · 估中先加分，估錯唔扣</div>`;
    else if (!settled) stat = `<div class="mstat mine">你估：<b>${selName(m, pick.sel)}</b> · 等賽果</div>`;
    else if (pick.status === 'won') stat = `<div class="mstat done">賽果：<b>${selName(m, m.result)}</b> · 估中 +${pick.earned} 分 🎉</div>`;
    else stat = `<div class="mstat lost">賽果：<b>${selName(m, m.result)}</b> · 今次估唔中，下次加油</div>`;
    wrap.innerHTML = `<div class="lg"><span>${m.league}</span><span>${m.time}</span></div>
      <div class="teams"><div class="team"><div class="fl">${m.home.f}</div><div class="nm">${m.home.n}</div></div><div class="vs">VS</div><div class="team"><div class="fl">${m.away.f}</div><div class="nm">${m.away.n}</div></div></div>
      <div class="picks">${ph}</div>${stat}`;
    list.appendChild(wrap);
  });
}
async function predict(matchId, sel) {
  if (MYPICKS[matchId]) return;
  try { await api('/api/predict', { method: 'POST', body: JSON.stringify({ matchId, sel }) }); await refresh(); }
  catch (e) { alert(e.message); }
}
async function renderLB() {
  try {
    const j = await api('/api/leaderboard'); const box = lbBox; box.innerHTML = '';
    if (!j.leaderboard.length) { box.innerHTML = '<div style="text-align:center;color:var(--muted);padding:8px">未有排名，快啲估波上分！</div>'; return; }
    j.leaderboard.forEach((r, i) => {
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
      const isMe = ME && r.username === ME.username;
      box.innerHTML += `<div class="lb-row"><div class="rank ${i < 3 ? 'top' : ''}">${medal}</div><div class="lb-name ${isMe ? 'me' : ''}">${r.username}${isMe ? '<span class="meb">你</span>' : ''}</div><div class="lb-pts">${r.points}</div></div>`;
    });
  } catch (e) {}
}
function renderProfile() {
  if (!ME) return; meName.textContent = ME.username; mePts.textContent = ME.points;
  meRate.textContent = ME.played ? Math.round(ME.correct / ME.played * 100) + '%（' + ME.correct + '/' + ME.played + '）' : '未有紀錄';
}
function go(v) {
  document.querySelectorAll('nav .tab').forEach(t => t.classList.toggle('on', t.dataset.v === v));
  document.getElementById('view-matches').classList.toggle('hidden', v !== 'matches');
  document.getElementById('view-lb').classList.toggle('hidden', v !== 'lb');
  document.getElementById('view-me').classList.toggle('hidden', v !== 'me');
  if (v === 'lb') renderLB(); if (v === 'me') renderProfile(); window.scrollTo(0, 0);
}
/* boot */
renderAuthMode();
(async () => { if (TOKEN) { try { const me = await api('/api/me'); ME = me.user; enter(); } catch (e) { logout(); } } })();
</script>
</body>
</html>
