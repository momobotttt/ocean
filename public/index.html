<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ScorePlay — 預測積分遊戲</title>
<style>
  :root{--bg:#ececec;--bg2:#f6f4f1;--card:#fff;--card2:#f4efe7;--line:#dcd6cc;--txt:#2f2820;--muted:#8c8275;--brown:#3f3327;--gold:#c39a2e;--amber:#b8860b;--cream:#f3e7cf;--green:#1ea672;--red:#cf4a54}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0 auto;max-width:520px;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;padding-bottom:74px}
  .hide{display:none!important}
  /* auth */
  .auth{max-width:360px;margin:0 auto;padding:50px 22px}
  .auth .logo{text-align:center;font-size:30px;font-weight:800;color:var(--brown);margin-bottom:4px}
  .auth .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
  .auth .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .auth label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px;font-weight:600}
  .auth input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font-size:15px}
  .auth .btn{width:100%;margin-top:16px}
  .auth .sw{text-align:center;margin-top:14px;font-size:13px;color:var(--gold);font-weight:700;cursor:pointer}
  .auth .msg{font-size:13px;color:var(--red);margin-top:10px;min-height:16px}
  .auth .disc{text-align:center;color:var(--muted);font-size:11px;margin-top:18px;line-height:1.6}
  /* header */
  header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#473a2c,#3a2f23);box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;color:var(--cream)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px}
  .brand .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#e0b94a);display:grid;place-items:center;font-size:15px;color:#3a2c10}
  .pts{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.22);border:1px solid rgba(220,200,150,.25);padding:6px 11px;border-radius:999px;font-weight:700;font-size:13px}
  .pts b{color:#7ee0b4}
  .ann{background:#fff5e0;color:#7a6326;font-size:12px;padding:8px 14px;border-bottom:1px solid #ecd9a8;display:flex;gap:8px;align-items:center}
  .btn{display:block;width:100%;text-align:center;background:linear-gradient(180deg,#e0b94a,#c39a2e);color:#3a2c08;font-weight:800;padding:13px;border-radius:12px;border:0;font-size:15px;cursor:pointer}
  .btn:disabled{opacity:.4}
  .sec{margin:18px 14px 8px;display:flex;align-items:center;gap:10px}
  .sec h3{margin:0;font-size:15px;text-transform:uppercase;color:#4a3c2c;font-weight:800}.sec .ln{flex:1;height:1px;background:var(--line)}
  .lghdr{margin:14px 14px 0;font-weight:800;color:#4a3c2c;font-size:14px}
  .ev{margin:8px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
  .ev .top{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-bottom:8px}
  .ev .live{color:var(--red);font-weight:700}
  .ev .tline{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:2px 0}
  .ev .tline .sc{margin-left:auto;color:#9a9182;font-weight:700}
  .mkcols{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
  .od{min-width:52px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 4px;text-align:center;cursor:pointer;transition:.12s}
  .od:active{transform:scale(.96)}
  .od.sel{background:linear-gradient(180deg,#e0b94a,#c39a2e);border-color:var(--gold);color:#3a2c08}
  .od .l{display:block;font-size:10px;color:var(--muted)}.od.sel .l{color:#5a4410}
  .od .v{font-weight:800;font-size:14px;color:var(--red)}.od.sel .v{color:#3a2c08}
  .od.flup{box-shadow:inset 0 0 0 2px #1ea672;background:#def5e8}.od.fldn{box-shadow:inset 0 0 0 2px #cf4a54;background:#f8dadd}
  .sc.flash{color:var(--green)!important;transform:scale(1.25);display:inline-block;transition:.2s}
  .pbar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line)}
  .pbar h2{margin:0;font-size:17px}.pbar .bk{font-size:18px;cursor:pointer;color:#6a5b45}
  .empty{text-align:center;padding:50px 24px;color:var(--muted)}.empty .big{font-size:50px;opacity:.7;margin-bottom:8px}
  .lb{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
  .lb .rk{width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;color:#6a5b45;flex:0 0 auto}
  .lb .rk.g{background:linear-gradient(135deg,#e0b94a,#c39a2e);color:#3a2c08}
  .lb .nm{flex:1;font-weight:600}.lb .pt{color:var(--gold);font-weight:800}
  .bethist{margin:8px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .bethist .st{float:right;font-weight:800;font-size:12px;padding:2px 8px;border-radius:6px}
  .st.open{background:#eef3fb;color:#3a6fb0}.st.won{background:#e3f6ec;color:#137a4f}.st.lost{background:#fbe4e6;color:#b13540}
  /* bottom nav */
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:linear-gradient(180deg,#46392b,#3a2f23);border-top:1px solid #5c4a32;z-index:40}
  .tabbar a{flex:1;text-align:center;padding:9px 2px 8px;color:#c4b79f;font-size:11px;cursor:pointer}.tabbar a.active{color:#fff}
  .tabbar a .i{display:block;font-size:20px;margin-bottom:2px}.tabbar a.mid{position:relative}
  .tabbar a .count{position:absolute;top:2px;right:26%;background:var(--gold);color:#3a2c08;font-weight:800;font-size:10px;min-width:16px;height:16px;border-radius:999px;display:grid;place-items:center}
  .tabbar a.bal .i,.tabbar a.bal b{color:#7ee0b4}
  /* slip / modal */
  .slip{position:fixed;left:50%;transform:translateX(-50%) translateY(120%);bottom:74px;width:100%;max-width:520px;background:var(--card);border-top:2px solid var(--gold);border-radius:18px 18px 0 0;z-index:45;transition:transform .25s;padding:14px 16px 18px;box-shadow:0 -12px 30px rgba(0,0,0,.25)}
  .slip.open{transform:translateX(-50%) translateY(0)}
  .slip h4{margin:0 0 10px;display:flex;align-items:center;color:#3f3327}.slip h4 .x{margin-left:auto;color:var(--muted);font-size:20px;cursor:pointer}
  .slipitem{font-size:13px;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--line)}.slipitem b{color:var(--txt)}
  .stake{display:flex;align-items:center;gap:10px;margin:12px 0}.stake input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px}.stake label{font-size:12px;color:var(--muted)}
  .winline{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}.winline b{color:var(--amber);font-size:16px}
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end}.modal.open{display:flex}
  .modal .bd{position:absolute;inset:0;background:rgba(0,0,0,.5)}
  .modal .sheet{position:relative;width:100%;max-width:520px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;max-height:86vh;overflow-y:auto;padding-bottom:24px}
  .mhead{position:sticky;top:0;background:linear-gradient(135deg,#4d4031,#352b20);color:var(--cream);padding:16px;border-radius:18px 18px 0 0}
  .mhead .x{position:absolute;top:12px;right:14px;font-size:22px;cursor:pointer}.mhead .lg{font-size:11px;opacity:.8;margin-bottom:8px}
  .mhead .vs{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px}.mhead .vs .sc{font-size:22px;color:var(--gold)}
  .mkblock{margin:14px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .mkblock .h{padding:10px 14px;font-weight:800;font-size:13px;background:var(--card2);color:#4a3c2c}.mkblock .g{display:flex;gap:8px;padding:12px 14px}
  footer{margin-top:8px;background:var(--bg2);border-top:1px solid var(--line);padding:20px 16px 26px;text-align:center;color:var(--muted);font-size:11px;line-height:1.7}
  footer .warn{color:var(--amber);font-weight:700}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#3f3327;color:#f3e7cf;border:1px solid var(--gold);padding:10px 18px;border-radius:999px;font-size:13px;z-index:70;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth" class="auth">
  <div class="logo">🎯 ScorePlay</div>
  <div class="sub">預測積分遊戲 · 純積分娛樂</div>
  <div class="card">
    <div id="authTitle" style="font-weight:800;margin-bottom:4px">登入</div>
    <label>用戶名</label><input id="au">
    <label>密碼</label><input id="ap" type="password">
    <div class="msg" id="authMsg"></div>
    <button class="btn" id="authBtn" onclick="doAuth()">登入</button>
    <div class="sw" id="authSwitch" onclick="toggleAuth()">未有帳戶？去註冊（送 1,000 積分）</div>
  </div>
  <div class="disc">純積分娛樂,不涉及任何金錢交易或真實投注。<br>Virtual points only — no real money. 18+</div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <header>
    <div class="topbar"><div class="brand"><span class="dot">⚽</span>ScorePlay</div>
      <div class="pts">積分 <b id="bal">0</b></div></div>
    <div id="annBar" class="ann hide"></div>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>

  <div class="slip" id="slip">
    <h4>🎟️ 預測單 <span class="x" onclick="closeSlip()">×</span></h4>
    <div id="slipBody"></div>
    <div class="stake"><label>投入積分</label><input id="stakeInput" type="number" value="100" min="1" oninput="calcWin()"></div>
    <div class="winline"><span>預計可贏</span><b id="winAmt">0</b></div>
    <button class="btn" id="placeBtn" onclick="placePick()">確認預測</button>
  </div>

  <div class="modal" id="modal"><div class="bd" onclick="closeModal()"></div><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
const $=id=>document.getElementById(id);
let TOKEN=localStorage.getItem('sp_token')||'', USER=null, MATCHES=[], slip=null, view='home', authMode='login', pollT=null;
async function api(p,opt={}){opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{},TOKEN?{Authorization:'Bearer '+TOKEN}:{});const r=await fetch(p,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('錯誤 '+r.status));return d;}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700);}
function fmt(n){return Number(n).toLocaleString('en-US');}
function esc(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

/* ---- auth ---- */
function toggleAuth(){authMode=authMode==='login'?'register':'login';$('authTitle').textContent=authMode==='login'?'登入':'註冊';$('authBtn').textContent=authMode==='login'?'登入':'註冊';$('authSwitch').textContent=authMode==='login'?'未有帳戶？去註冊（送 1,000 積分）':'已有帳戶？去登入';$('authMsg').textContent='';}
async function doAuth(){
  const username=$('au').value.trim(),password=$('ap').value;
  if(!username||!password){$('authMsg').textContent='請填用戶名同密碼';return;}
  try{const d=await api('/api/'+(authMode==='login'?'login':'register'),{method:'POST',body:JSON.stringify({username,password})});
    TOKEN=d.token;localStorage.setItem('sp_token',TOKEN);USER=d.user;enterApp();}
  catch(e){$('authMsg').textContent=e.message;}
}
function logout(){TOKEN='';USER=null;localStorage.removeItem('sp_token');clearInterval(pollT);$('app').classList.add('hide');$('auth').classList.remove('hide');}
function enterApp(){$('auth').classList.add('hide');$('app').classList.remove('hide');syncBal();loadMatches().then(()=>go('home'));clearInterval(pollT);pollT=setInterval(poll,3000);}
function syncBal(){if(USER)$('bal').textContent=fmt(USER.points);}

/* ---- data ---- */
async function loadMatches(){const d=await api('/api/matches');MATCHES=d.matches;$('annBar').textContent='📣 '+(d.announcement||'');$('annBar').classList.toggle('hide',!d.announcement);}
async function refreshMe(){try{const d=await api('/api/me');USER=d.user;syncBal();}catch(e){}}

/* ---- nav ---- */
function renderNav(){
  const nav=[['home','🏠','主頁'],['board','🏆','排行榜'],['slip','🎟️','預測單'],['mybets','📋','我的預測'],['bal','💎','']];
  $('tabbar').innerHTML=nav.map(n=>{
    if(n[0]==='slip')return `<a class="mid" onclick="openSlip()"><span class="i">🎟️</span><span class="count">${slip?1:0}</span>預測單</a>`;
    if(n[0]==='bal')return `<a class="bal" onclick="go('me')"><span class="i">💎</span><b>${USER?fmt(USER.points):0}</b></a>`;
    return `<a class="${view===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="i">${n[1]}</span>${n[2]}</a>`;
  }).join('');
}
function go(v){if(v==='slip'){openSlip();return;}view=v;window.scrollTo(0,0);render();}

/* ---- event row ---- */
function odCell(m,key,idx,lab,val){
  if(!val)return `<div class="od" style="opacity:.3">-</div>`;
  const sel=slip&&slip.matchId===m.id&&slip.key===key&&slip.idx===idx?'sel':'';
  return `<div class="od ${sel}" data-od="${m.id}-${key}-${idx}" onclick="pick(${m.id},'${key}',${idx},'${esc(lab)}',${val})"><span class="l">${lab}</span><span class="v">${(+val).toFixed(2)}</span></div>`;
}
function evRow(m){
  return `<div class="ev">
    <div class="top"><span>${esc(m.league)}</span>${m.status==='live'?'<span class="live">● LIVE</span>':''}<span data-tm="${m.id}">${esc(m.time)}</span>
      <span style="margin-left:auto;color:#b9a;cursor:pointer" onclick="openMatch(${m.id})">詳情 ›</span></div>
    <div onclick="openMatch(${m.id})">
      <div class="tline"><span>${esc(m.home)}</span><span class="sc" data-sc="${m.id}-h">${m.hs}</span></div>
      <div class="tline"><span>${esc(m.away)}</span><span class="sc" data-sc="${m.id}-a">${m.as}</span></div>
    </div>
    <div class="mkcols">${odCell(m,'1x2',0,'1',m.o[0])}${odCell(m,'1x2',1,'X',m.o[1])}${odCell(m,'1x2',2,'2',m.o[2])}</div>
  </div>`;
}

/* ---- views ---- */
function render(){
  renderNav();
  const v=$('view');
  if(view==='home'){
    const live=MATCHES.filter(m=>m.status==='live'),up=MATCHES.filter(m=>m.status!=='live'&&m.status!=='finished');
    v.innerHTML=`${live.length?`<div class="sec"><span class="ln"></span><h3>🔴 即場賽事</h3><span class="ln"></span></div>${live.map(evRow).join('')}`:''}
      <div class="sec"><span class="ln"></span><h3>即將開賽</h3><span class="ln"></span></div>
      ${up.length?up.map(evRow).join(''):'<div class="empty"><div class="big">📅</div>暫時冇即將開賽</div>'}
      <footer><b>ScorePlay</b> · 預測積分遊戲<br><span class="warn">純積分娛樂,不涉及任何金錢交易。</span><br>Virtual points only — no real money. 18+<br><br><span style="cursor:pointer;color:var(--gold)" onclick="logout()">登出</span></footer>`;
  } else if(view==='board'){ loadBoard(); v.innerHTML='<div class="pbar"><span class="bk" onclick="go(\'home\')">‹</span><h2>🏆 排行榜</h2></div><div id="lbList" class="empty">載入中…</div>'; }
  else if(view==='mybets'){ loadMyBets(); v.innerHTML='<div class="pbar"><span class="bk" onclick="go(\'home\')">‹</span><h2>📋 我的預測</h2></div><div id="betList" class="empty">載入中…</div>'; }
  else if(view==='me'){ v.innerHTML=`<div class="pbar"><span class="bk" onclick="go('home')">‹</span><h2>💎 我的帳戶</h2></div>
      <div class="bethist" style="text-align:center"><div style="font-size:13px;color:var(--muted)">${USER?esc(USER.username):''}</div><div style="font-size:40px;font-weight:800;color:var(--gold);margin:6px 0">${USER?fmt(USER.points):0}</div><div style="font-size:12px;color:var(--muted)">積分</div></div>
      <div style="padding:14px"><button class="btn" onclick="logout()" style="background:var(--brown);color:var(--cream)">登出</button></div>`; }
}
async function loadBoard(){try{const d=await api('/api/leaderboard');$('lbList').className='';$('lbList').innerHTML=d.leaderboard.map(r=>`<div class="lb"><div class="rk ${r.rank<=3?'g':''}">${r.rank}</div><div class="nm">${esc(r.username)}</div><div class="pt">${fmt(r.points)}</div></div>`).join('')||'<div class="empty">未有玩家</div>';}catch(e){}}
async function loadMyBets(){try{const d=await api('/api/mybets');const L=$('betList');L.className='';const map={open:'未開賽',won:'贏咗',lost:'輸咗'};
  L.innerHTML=d.bets.length?d.bets.map(b=>`<div class="bethist"><span class="st ${b.status}">${map[b.status]||b.status}</span><b>${esc(b.label)}</b><div style="font-size:12px;color:var(--muted);margin-top:6px">投入 ${fmt(b.stake)} · 賠率 ${b.odd} · 可贏 ${fmt(b.potential)}</div></div>`).join(''):'<div class="empty"><div class="big">📋</div>仲未有預測,去揀場波試吓 👆</div>';}catch(e){}}

/* ---- pick ---- */
function pick(mid,key,idx,lab,val){const m=MATCHES.find(x=>x.id===mid);const pmap={'1x2':{0:'1',1:'X',2:'2'},hdp:{0:'1',1:'2'},ou:{0:'O',1:'U'}};
  slip={matchId:mid,key,idx,market:key,pick:pmap[key][idx],odd:+val,label:`${m.home} v ${m.away} — ${lab}`};
  renderNav();document.querySelectorAll('.od.sel').forEach(e=>e.classList.remove('sel'));
  document.querySelectorAll(`[data-od="${mid}-${key}-${idx}"]`).forEach(e=>e.classList.add('sel'));openSlip();}
function renderSlip(){$('slipBody').innerHTML=slip?`<div class="slipitem"><b>${esc(slip.label)}</b><br>賠率 ${slip.odd.toFixed(2)}</div>`:'<div class="slipitem">未揀任何預測</div>';$('placeBtn').disabled=!slip;}
function calcWin(){const s=+$('stakeInput').value||0;$('winAmt').textContent=fmt(slip?Math.round(s*slip.odd):0);}
function openSlip(){if(!slip){toast('先揀一個賠率 👆');return;}renderSlip();$('slip').classList.add('open');calcWin();}
function closeSlip(){$('slip').classList.remove('open');}
async function placePick(){const stake=+$('stakeInput').value||0;if(!slip)return;
  try{const d=await api('/api/predict',{method:'POST',body:JSON.stringify({matchId:slip.matchId,market:slip.market,pick:slip.pick,label:slip.label,odd:slip.odd,stake})});
    USER.points=d.points;syncBal();toast('✅ 預測已下！可贏 '+fmt(d.bet.potential));slip=null;closeSlip();renderNav();document.querySelectorAll('.od.sel').forEach(e=>e.classList.remove('sel'));}
  catch(e){toast('⚠️ '+e.message);}
}

/* ---- match detail ---- */
function openMatch(id){const e=MATCHES.find(x=>x.id===id);if(!e)return;
  $('sheet').innerHTML=`<div class="mhead"><span class="x" onclick="closeModal()">×</span><div class="lg">${esc(e.league)} · ${e.status==='live'?'🔴 '+esc(e.time):esc(e.time)}</div>
    <div class="vs"><span>${esc(e.home)}</span><span class="sc">${e.hs} : ${e.as}</span><span>${esc(e.away)}</span></div></div>
    <div class="mkblock"><div class="h">勝負 (1 X 2)</div><div class="g">${odCell(e,'1x2',0,'主勝',e.o[0])}${odCell(e,'1x2',1,'和',e.o[1])}${odCell(e,'1x2',2,'客勝',e.o[2])}</div></div>
    <div class="mkblock"><div class="h">讓球 (${esc(e.hdp.line)})</div><div class="g">${odCell(e,'hdp',0,'主 '+esc(e.hdp.line),e.hdp.h)}${odCell(e,'hdp',1,'客',e.hdp.a)}</div></div>
    <div class="mkblock"><div class="h">大細 (${esc(e.ou.line)})</div><div class="g">${odCell(e,'ou',0,'大',e.ou.o)}${odCell(e,'ou',1,'細',e.ou.u)}</div></div>`;
  $('modal').classList.add('open');}
function closeModal(){$('modal').classList.remove('open');}

/* ---- live poll + flash ---- */
function flashOdd(id,key,idx,nv,ov){document.querySelectorAll(`[data-od="${id}-${key}-${idx}"]`).forEach(c=>{const v=c.querySelector('.v');if(v)v.textContent=(+nv).toFixed(2);c.classList.remove('flup','fldn');void c.offsetWidth;c.classList.add(nv>ov?'flup':'fldn');setTimeout(()=>c.classList.remove('flup','fldn'),900);});}
function setSc(id,side,val){document.querySelectorAll(`[data-sc="${id}-${side}"]`).forEach(s=>{if(s.textContent!=String(val)){s.textContent=val;s.classList.add('flash');setTimeout(()=>s.classList.remove('flash'),900);}});}
function setTm(id,t){document.querySelectorAll(`[data-tm="${id}"]`).forEach(e=>e.textContent=t);}
async function poll(){
  let d;try{d=await api('/api/matches');}catch(e){return;}
  const old={};MATCHES.forEach(m=>old[m.id]=m);
  d.matches.forEach(m=>{const o=old[m.id];if(!o)return;
    ['1x2'].forEach(k=>m.o.forEach((v,i)=>{if(v&&o.o[i]&&v!==o.o[i])flashOdd(m.id,'1x2',i,v,o.o[i]);}));
    if(m.hdp.h!==o.hdp.h)flashOdd(m.id,'hdp',0,m.hdp.h,o.hdp.h);
    if(m.hdp.a!==o.hdp.a)flashOdd(m.id,'hdp',1,m.hdp.a,o.hdp.a);
    if(m.ou.o!==o.ou.o)flashOdd(m.id,'ou',0,m.ou.o,o.ou.o);
    if(m.ou.u!==o.ou.u)flashOdd(m.id,'ou',1,m.ou.u,o.ou.u);
    if(m.hs!==o.hs)setSc(m.id,'h',m.hs);
    if(m.as!==o.as)setSc(m.id,'a',m.as);
    if(m.time!==o.time)setTm(m.id,m.time);
  });
  const structChanged=d.matches.length!==MATCHES.length||d.matches.some(m=>!old[m.id]||old[m.id].status!==m.status);
  MATCHES=d.matches;$('annBar').textContent='📣 '+(d.announcement||'');$('annBar').classList.toggle('hide',!d.announcement);
  if(structChanged&&view==='home')render();
  refreshMe();
}

/* ---- boot ---- */
(async()=>{ if(TOKEN){try{const d=await api('/api/me');USER=d.user;enterApp();}catch(e){TOKEN='';localStorage.removeItem('sp_token');}} })();
</script>
