<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>海洋 · 估波遊戲</title>
<style>
  :root{
    --deep:#052540; --deep2:#0a3b63; --blue:#1673b8; --sky:#3fa7dd;
    --light:#7fd0ef; --foam:#d6f1fb; --white:#ffffff;
    --gold:#ffcf5c; --gold-d:#e8a72c; --good:#1fb27a; --line:rgba(255,255,255,.14);
    --ink:#eaf6fd; --muted:#9db9cc;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,"PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% -10%, #0d456f 0%, var(--deep2) 42%, var(--deep) 100%);
    min-height:100dvh; overflow-x:hidden;
  }
  /* animated wave band behind header */
  .waves{position:fixed; top:0; left:0; right:0; height:180px; z-index:0; opacity:.5; pointer-events:none;}
  .app{position:relative; z-index:1; max-width:480px; margin:0 auto; padding:0 16px 96px; min-height:100dvh;}

  header.brand{display:flex; align-items:center; gap:11px; padding:20px 4px 12px;}
  .logo{width:44px;height:44px;flex:0 0 44px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35));}
  .brand h1{margin:0; font-size:22px; letter-spacing:.28em; font-weight:800;
    background:linear-gradient(180deg,#fff,#bfe6f7); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .brand .tag{font-size:11px; color:var(--light); letter-spacing:.12em; margin-top:2px;}

  .card{background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.045));
    border:1px solid var(--line); border-radius:18px; padding:16px; margin:12px 0;
    backdrop-filter:blur(6px); box-shadow:0 8px 24px rgba(0,10,25,.28);}

  /* auth */
  .auth-wrap{padding-top:6vh;}
  .auth-hero{text-align:center; margin-bottom:8px;}
  .auth-hero .big{font-size:26px; font-weight:800; letter-spacing:.3em;
    background:linear-gradient(180deg,#fff,#a9def6);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .auth-hero p{color:var(--muted); font-size:13px; margin:6px 0 0;}
  label{display:block; font-size:12px; color:var(--light); margin:12px 2px 6px;}
  input{width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:rgba(3,20,36,.55); color:#fff; font-size:16px; outline:none;}
  input:focus{border-color:var(--sky); box-shadow:0 0 0 3px rgba(63,167,221,.22);}
  .btn{width:100%; padding:14px; border:none; border-radius:13px; font-size:16px; font-weight:700;
    background:linear-gradient(180deg,var(--sky),var(--blue)); color:#fff; margin-top:16px;
    box-shadow:0 6px 16px rgba(22,115,184,.4); cursor:pointer;}
  .btn:active{transform:translateY(1px);}
  .btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold-d)); color:#3a2600; box-shadow:0 6px 16px rgba(232,167,44,.4);}
  .btn.ghost{background:transparent; border:1px solid var(--line); box-shadow:none; color:var(--ink);}
  .switch{text-align:center; margin-top:14px; font-size:13px; color:var(--muted);}
  .switch a{color:var(--light); font-weight:700; text-decoration:none;}
  .err{color:#ff9a9a; font-size:12.5px; text-align:center; margin-top:10px; min-height:16px;}

  /* top user bar */
  .userbar{display:flex; align-items:center; justify-content:space-between; margin:10px 0 4px;}
  .userbar .hi{font-size:14px;} .userbar .hi b{color:#fff;}
  .pts{display:flex; align-items:center; gap:6px; background:rgba(255,207,92,.14);
    border:1px solid rgba(255,207,92,.4); padding:6px 12px; border-radius:999px; font-weight:800; color:var(--gold);}
  .pts small{color:var(--muted); font-weight:600;}

  /* match card */
  .sect-t{font-size:13px; color:var(--light); letter-spacing:.1em; margin:16px 4px 2px; font-weight:700;}
  .match .lg{font-size:11px; color:var(--muted); display:flex; justify-content:space-between; margin-bottom:10px;}
  .teams{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-bottom:12px;}
  .team{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .team .fl{font-size:26px;} .team .nm{font-size:13px; font-weight:700; text-align:center; line-height:1.2;}
  .vs{font-size:12px; color:var(--muted); font-weight:800;}
  .picks{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .pick{border:1px solid var(--line); background:rgba(3,20,36,.4); border-radius:12px; padding:9px 6px;
    text-align:center; cursor:pointer; transition:.15s;}
  .pick .p-l{font-size:11px; color:var(--muted);} .pick .p-o{font-size:16px; font-weight:800; color:#fff; margin-top:2px;}
  .pick .p-pts{font-size:10px; color:var(--gold); margin-top:2px;}
  .pick.sel{border-color:var(--sky); background:rgba(63,167,221,.2); box-shadow:0 0 0 2px rgba(63,167,221,.35) inset;}
  .pick.locked{opacity:.55; cursor:default;}
  .pick.win{border-color:var(--good); background:rgba(31,178,122,.2);}
  .mstat{font-size:11px; margin-top:10px; color:var(--muted); text-align:center;}
  .mstat.done{color:var(--good);} .mstat.mine b{color:var(--light);}

  /* leaderboard */
  .lb-row{display:flex; align-items:center; gap:12px; padding:11px 6px; border-bottom:1px solid var(--line);}
  .lb-row:last-child{border-bottom:none;}
  .rank{width:26px; text-align:center; font-weight:800; color:var(--muted);}
  .rank.top{color:var(--gold); font-size:17px;}
  .lb-name{flex:1; font-weight:600;} .lb-name.me{color:var(--light);}
  .lb-name .meb{font-size:10px; background:var(--blue); color:#fff; padding:1px 6px; border-radius:6px; margin-left:6px;}
  .lb-pts{font-weight:800; color:var(--gold);}

  /* bottom nav */
  nav.tabs{position:fixed; bottom:0; left:0; right:0; z-index:5; display:flex; justify-content:center;
    background:linear-gradient(180deg, rgba(5,25,45,.2), rgba(4,20,36,.96)); border-top:1px solid var(--line);
    backdrop-filter:blur(10px); padding-bottom:env(safe-area-inset-bottom);}
  nav.tabs .in{display:flex; width:100%; max-width:480px;}
  .tab{flex:1; text-align:center; padding:11px 0 12px; color:var(--muted); font-size:11px; cursor:pointer;}
  .tab .ic{font-size:20px; display:block; margin-bottom:2px;}
  .tab.on{color:var(--light);}
  .hidden{display:none !important;}
  .note{font-size:11px; color:var(--muted); text-align:center; margin:16px 4px 0; line-height:1.5;}
  .foam-line{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:6px 0;}
</style>
</head>
<body>
<svg class="waves" viewBox="0 0 480 180" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0,60 C120,110 240,10 480,70 L480,0 L0,0 Z" fill="#1673b8" opacity=".5"/>
  <path d="M0,90 C160,40 300,130 480,80 L480,0 L0,0 Z" fill="#3fa7dd" opacity=".4"/>
  <path d="M0,120 C140,160 320,60 480,120 L480,0 L0,0 Z" fill="#7fd0ef" opacity=".25"/>
</svg>

<div class="app">
  <header class="brand">
    <svg class="logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#bfe9fb"/><stop offset="1" stop-color="#1673b8"/></linearGradient></defs>
      <circle cx="24" cy="24" r="22" fill="#062a4a" stroke="url(#g)" stroke-width="2"/>
      <path d="M6 30 C13 22 18 34 24 27 C30 20 35 32 42 25" fill="none" stroke="#7fd0ef" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M8 36 C15 29 19 39 24 33 C29 27 34 37 40 31" fill="none" stroke="#3fa7dd" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
    </svg>
    <div><h1>海洋</h1><div class="tag">估波 · 儲分 · 打排行榜</div></div>
  </header>

  <!-- AUTH -->
  <section id="auth" class="auth-wrap">
    <div class="auth-hero">
      <div class="big">海洋</div>
      <p id="authSub">登入你嘅帳戶，開始估波儲分</p>
    </div>
    <div class="card">
      <label>帳號</label>
      <input id="u" autocomplete="username" placeholder="改個名俾自己">
      <label>密碼</label>
      <input id="p" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="btn" id="authBtn" onclick="doAuth()">登入</button>
      <div class="err" id="authErr"></div>
      <div class="switch" id="authSwitch">未有帳戶？<a onclick="toggleMode()">註冊一個</a></div>
    </div>
    <div class="note">積分純遊戲用嚟打排行榜，唔可以買、唔可以換錢。<br>估中先加分，估錯唔會扣，安心玩。</div>
  </section>

  <!-- MAIN -->
  <main id="main" class="hidden">
    <div class="userbar">
      <div class="hi">你好，<b id="uname">—</b> 👋</div>
      <div class="pts">🪙 <span id="upts">0</span> <small>分</small></div>
    </div>

    <!-- MATCHES -->
    <section id="view-matches">
      <div class="sect-t">今期賽事 · 估中邊隊贏</div>
      <div id="matchList"></div>
      <button class="btn gold" onclick="settleDemo()">🔎 睇結果 · 結算今期（示範）</button>
      <div class="note">真實版會自動連 betsapi 攞賽事、賠率同賽果，估中即刻上分。<br>估啱冷門（賠率高）加多啲分做難度獎勵。</div>
    </section>

    <!-- LEADERBOARD -->
    <section id="view-lb" class="hidden">
      <div class="sect-t">排行榜 · 邊個估得最叻</div>
      <div class="card" id="lbBox"></div>
      <div class="note">排名淨係計積分，積分係遊戲分數，唔涉及任何金錢。</div>
    </section>

    <!-- PROFILE -->
    <section id="view-me" class="hidden">
      <div class="sect-t">我嘅帳戶</div>
      <div class="card">
        <div class="userbar" style="margin:0"><div class="hi">帳號</div><b id="meName">—</b></div>
        <div class="foam-line"></div>
        <div class="userbar" style="margin:0"><div class="hi">總積分</div><span class="lb-pts" id="mePts">0</span></div>
        <div class="foam-line"></div>
        <div class="userbar" style="margin:0"><div class="hi">估中率</div><b id="meRate">—</b></div>
      </div>
      <button class="btn ghost" onclick="logout()">登出</button>
      <div class="note">呢個係示範版（v1）。帳戶同積分暫時存喺你部電話／瀏覽器度。<br>正式版會有後台同 betsapi 真賽事。</div>
    </section>
  </main>
</div>

<nav class="tabs hidden" id="nav">
  <div class="in">
    <div class="tab on" data-v="matches" onclick="go('matches')"><span class="ic">⚽</span>賽事</div>
    <div class="tab" data-v="lb" onclick="go('lb')"><span class="ic">🏆</span>排行榜</div>
    <div class="tab" data-v="me" onclick="go('me')"><span class="ic">🌊</span>我</div>
  </div>
</nav>

<script>
/* ---------- storage helpers (demo: localStorage) ---------- */
const DB = {
  users(){ return JSON.parse(localStorage.getItem('ocean_users')||'{}'); },
  saveUsers(u){ localStorage.setItem('ocean_users', JSON.stringify(u)); },
  session(){ return localStorage.getItem('ocean_session'); },
  setSession(n){ n? localStorage.setItem('ocean_session',n) : localStorage.removeItem('ocean_session'); },
};

/* ---------- sample fixtures (betsapi plugs in here) ----------
   In production: fetchMatches() calls betsapi for real fixtures + odds + results.
   `result` is hidden until settled; here it's pre-set for the demo. */
const SAMPLE = [
  {id:'m1', lg:'英超', t:'19:30', h:{n:'利物浦',f:'🔴'}, a:{n:'阿仙奴',f:'🔵'}, o:{home:1.85,draw:3.60,away:4.20}, result:'home'},
  {id:'m2', lg:'西甲', t:'22:00', h:{n:'巴塞',f:'🔵'}, a:{n:'皇馬',f:'⚪'}, o:{home:2.40,draw:3.30,away:2.85}, result:'away'},
  {id:'m3', lg:'意甲', t:'02:45', h:{n:'國際米蘭',f:'🔵'}, a:{n:'祖雲達斯',f:'⚫'}, o:{home:2.10,draw:3.20,away:3.60}, result:'draw'},
  {id:'m4', lg:'德甲', t:'21:30', h:{n:'拜仁',f:'🔴'}, a:{n:'多蒙特',f:'🟡'}, o:{home:1.55,draw:4.30,away:5.50}, result:'away'},
];
function fetchMatches(){ /* TODO betsapi: return live fixtures/odds/results */ return SAMPLE; }

/* points for a correct pick = round(odds * 10). wrong pick = 0 (gain-only, no loss) */
function ptsFor(odds){ return Math.round(odds*10); }

let mode='login';
function toggleMode(){ mode = mode==='login'?'register':'login'; renderAuthMode(); }
function renderAuthMode(){
  document.getElementById('authBtn').textContent = mode==='login'?'登入':'註冊';
  document.getElementById('authSub').textContent = mode==='login'?'登入你嘅帳戶，開始估波儲分':'改個名同密碼，即刻開始玩';
  document.getElementById('authSwitch').innerHTML = mode==='login'
    ? '未有帳戶？<a onclick="toggleMode()">註冊一個</a>' : '已經有帳戶？<a onclick="toggleMode()">去登入</a>';
  document.getElementById('authErr').textContent='';
}
function doAuth(){
  const u=document.getElementById('u').value.trim(), p=document.getElementById('p').value;
  const err=document.getElementById('authErr');
  if(!u||!p){ err.textContent='請填帳號同密碼'; return; }
  const users=DB.users();
  if(mode==='register'){
    if(users[u]){ err.textContent='呢個帳號已經有人用'; return; }
    users[u]={pw:p, pts:0, picks:{}, correct:0, played:0}; DB.saveUsers(users);
  } else {
    if(!users[u]||users[u].pw!==p){ err.textContent='帳號或密碼唔啱'; return; }
  }
  DB.setSession(u); enter();
}
function logout(){ DB.setSession(null); location.reload(); }

/* ---------- app ---------- */
function me(){ const u=DB.session(); return u? DB.users()[u] : null; }
function saveMe(obj){ const u=DB.session(); const users=DB.users(); users[u]=obj; DB.saveUsers(users); }

function enter(){
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('nav').classList.remove('hidden');
  document.getElementById('uname').textContent=DB.session();
  renderAll(); go('matches');
}
function renderAll(){ renderTop(); renderMatches(); renderLB(); renderProfile(); }
function renderTop(){ const m=me(); document.getElementById('upts').textContent=m.pts; }

function renderMatches(){
  const m=me(), list=document.getElementById('matchList'); list.innerHTML='';
  fetchMatches().forEach(g=>{
    const pick=m.picks[g.id]; const settled = pick && pick.settled;
    const wrap=document.createElement('div'); wrap.className='card match';
    let picksHtml='';
    ['home','draw','away'].forEach(k=>{
      const lbl = k==='home'?g.h.n : k==='draw'?'和' : g.a.n;
      const sel = pick && pick.sel===k ? 'sel':'';
      const locked = pick ? 'locked':'';
      const win = settled && g.result===k ? 'win':'';
      picksHtml += `<div class="pick ${sel} ${locked} ${win}" onclick="pickIt('${g.id}','${k}')">
        <div class="p-l">${lbl}</div><div class="p-o">${g.o[k].toFixed(2)}</div>
        <div class="p-pts">+${ptsFor(g.o[k])}</div></div>`;
    });
    let stat='';
    if(!pick) stat=`<div class="mstat">揀一個估法 · 估中先加分，估錯唔扣</div>`;
    else if(!settled) stat=`<div class="mstat mine">你估：<b>${pick.sel==='home'?g.h.n:pick.sel==='draw'?'和':g.a.n}</b> · 等結算</div>`;
    else {
      const won = g.result===pick.sel;
      stat=`<div class="mstat done">賽果：<b>${g.result==='home'?g.h.n:g.result==='draw'?'和':g.a.n}</b> · ${won?('估中 +'+ptsFor(g.o[pick.sel])+' 分 🎉'):'今次估唔中，下次加油'}</div>`;
    }
    wrap.innerHTML=`
      <div class="lg"><span>${g.lg}</span><span>${g.t}</span></div>
      <div class="teams">
        <div class="team"><div class="fl">${g.h.f}</div><div class="nm">${g.h.n}</div></div>
        <div class="vs">VS</div>
        <div class="team"><div class="fl">${g.a.f}</div><div class="nm">${g.a.n}</div></div>
      </div>
      <div class="picks">${picksHtml}</div>${stat}`;
    list.appendChild(wrap);
  });
}
function pickIt(gid,k){
  const m=me(); if(m.picks[gid]){ return; } // one pick per match, locked after
  m.picks[gid]={sel:k, settled:false}; saveMe(m); renderMatches();
}
function settleDemo(){
  const m=me(); let gained=0, any=false;
  fetchMatches().forEach(g=>{
    const pk=m.picks[g.id]; if(!pk||pk.settled) return;
    any=true; pk.settled=true; m.played++;
    if(g.result===pk.sel){ const add=ptsFor(g.o[pk.sel]); m.pts+=add; gained+=add; m.correct++; }
  });
  saveMe(m);
  if(!any){ alert('未揀任何估法，或者已經全部結算咗。'); return; }
  renderAll();
  alert(gained>0? ('恭喜！呢期估中，加咗 '+gained+' 分 🎉') : '呢期未估中，繼續努力，估錯唔會扣分。');
  go('lb');
}

function renderLB(){
  const users=DB.users(); const me_=DB.session();
  const arr=Object.keys(users).map(n=>({n, pts:users[n].pts})).sort((a,b)=>b.pts-a.pts);
  // seed a few sample rivals so the board isn't empty on a fresh install
  const seeds=[['阿俊',420],['細 May',360],['波友 Ken',300],['海豚',255],['浪花',180]];
  seeds.forEach(([n,p])=>{ if(!arr.find(x=>x.n===n)) arr.push({n,pts:p,seed:true}); });
  arr.sort((a,b)=>b.pts-a.pts);
  const box=document.getElementById('lbBox'); box.innerHTML='';
  arr.slice(0,12).forEach((r,i)=>{
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    const isMe = r.n===me_;
    box.innerHTML += `<div class="lb-row">
      <div class="rank ${i<3?'top':''}">${medal}</div>
      <div class="lb-name ${isMe?'me':''}">${r.n}${isMe?'<span class="meb">你</span>':''}</div>
      <div class="lb-pts">${r.pts}</div></div>`;
  });
}
function renderProfile(){
  const m=me();
  document.getElementById('meName').textContent=DB.session();
  document.getElementById('mePts').textContent=m.pts;
  document.getElementById('meRate').textContent = m.played? Math.round(m.correct/m.played*100)+'%（'+m.correct+'/'+m.played+'）' : '未有紀錄';
}

function go(v){
  document.querySelectorAll('nav .tab').forEach(t=>t.classList.toggle('on', t.dataset.v===v));
  document.getElementById('view-matches').classList.toggle('hidden', v!=='matches');
  document.getElementById('view-lb').classList.toggle('hidden', v!=='lb');
  document.getElementById('view-me').classList.toggle('hidden', v!=='me');
  if(v==='lb') renderLB(); if(v==='me') renderProfile();
  window.scrollTo(0,0);
}

/* demo preview mode: open with ?demo=1 to skip login and see gameplay */
function seedDemo(){
  const users=DB.users();
  users['海洋玩家']={pw:'x', pts:19, correct:1, played:1,
    picks:{ m1:{sel:'home',settled:true}, m2:{sel:'away',settled:false} }};
  DB.saveUsers(users); DB.setSession('海洋玩家');
}
/* boot */
renderAuthMode();
const _q=new URLSearchParams(location.search);
if(_q.get('demo')==='1') seedDemo();
if(DB.session() && DB.users()[DB.session()]){ enter(); if(_q.get('view')) go(_q.get('view')); }
</script>
</body>
</html>
